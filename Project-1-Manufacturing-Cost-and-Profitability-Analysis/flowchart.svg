<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
  <rect width="720" height="900" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#172033" stroke="#333" stroke-width="2">
    <rect x="260" y="25" width="200" height="55" rx="28" fill="#dceeff"/><text x="360" y="60" stroke="none">START</text>
    <path d="M360 80 V115" marker-end="url(#arrow)" fill="none"/>
    <rect x="150" y="120" width="420" height="95" rx="8" fill="#f4f6f8"/><text x="360" y="150" stroke="none"><tspan x="360">Input units, material/labour costs,</tspan><tspan x="360" dy="25">wastage, machine cost, selling price</tspan><tspan x="360" dy="25">and target profit</tspan></text>
    <path d="M360 215 V250" marker-end="url(#arrow)" fill="none"/>
    <polygon points="360,250 510,320 360,390 210,320" fill="#fff0cf"/><text x="360" y="315" stroke="none"><tspan x="360">Are inputs</tspan><tspan x="360" dy="24">valid?</tspan></text>
    <path d="M210 320 H100 V410" marker-end="url(#arrow)" fill="none"/><text x="145" y="305" stroke="none" font-size="16">No</text>
    <rect x="20" y="415" width="160" height="75" rx="8" fill="#ffe2e2"/><text x="100" y="445" stroke="none"><tspan x="100">Display invalid</tspan><tspan x="100" dy="24">input message</tspan></text>
    <path d="M510 320 H620 V410" marker-end="url(#arrow)" fill="none"/><text x="565" y="305" stroke="none" font-size="16">Yes</text>
    <rect x="490" y="415" width="220" height="90" rx="8" fill="#e2f5e9"/><text x="600" y="445" stroke="none"><tspan x="600">Calculate total cost,</tspan><tspan x="600" dy="24">revenue, profit and</tspan><tspan x="600" dy="24">cost per unit</tspan></text>
    <path d="M600 505 V540" marker-end="url(#arrow)" fill="none"/>
    <polygon points="600,540 700,600 600,660 500,600" fill="#fff0cf"/><text x="600" y="595" stroke="none"><tspan x="600">Profit ≥</tspan><tspan x="600" dy="22">target?</tspan></text>
    <path d="M500 600 H430 V700" marker-end="url(#arrow)" fill="none"/><text x="455" y="585" stroke="none" font-size="16">No</text>
    <rect x="320" y="705" width="220" height="60" rx="8" fill="#f4f6f8"/><text x="430" y="730" stroke="none"><tspan x="430">Target not</tspan><tspan x="430" dy="22">achieved</tspan></text>
    <path d="M600 660 V700" marker-end="url(#arrow)" fill="none"/><text x="625" y="685" stroke="none" font-size="16">Yes</text>
    <rect x="540" y="705" width="160" height="60" rx="8" fill="#dceeff"/><text x="620" y="741" stroke="none">Target achieved</text>
    <path d="M100 490 V820 H360 V850" marker-end="url(#arrow)" fill="none"/>
    <path d="M430 765 V820 H360" marker-end="url(#arrow)" fill="none"/>
    <path d="M620 765 V820 H360" marker-end="url(#arrow)" fill="none"/>
    <rect x="260" y="850" width="200" height="40" rx="20" fill="#dceeff"/><text x="360" y="876" stroke="none">STOP</text>
  </g>
</svg>